<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0;url=./数理逻辑.html">
  <title>科大课程复习</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --text: #191919;
      --muted: #666;
      --accent: #2f6f5e;
      --accent-dark: #245648;
      --line: #d8d8d2;
      --panel: #fff;
      --soft: #eef4f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(100%, 640px);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--accent);
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
    }

    a:hover {
      background: var(--accent-dark);
    }

    .fallback {
      margin-top: 14px;
      padding: 12px 14px;
      border-left: 4px solid var(--accent);
      border-radius: 0 7px 7px 0;
      background: var(--soft);
      color: var(--text);
    }
  </style>
  <script>
    window.location.replace("./数理逻辑.html");
  </script>
</head>
<body>
  <main>
    <h1>科大课程复习</h1>
    <p>正在进入数理逻辑真题向练习。</p>
    <a href="./数理逻辑.html">打开数理逻辑练习</a>
    <p class="fallback">如果页面没有自动跳转，请使用上面的链接进入练习页。</p>
  </main>
</body>
</html>
