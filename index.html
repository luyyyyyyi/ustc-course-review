<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>科大课程复习</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --text: #191919;
      --muted: #666;
      --accent: #2f6f5e;
      --accent-dark: #245648;
      --line: #d8d8d2;
      --panel: #fff;
      --soft: #eef4f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.65;
    }

    main {
      width: min(100%, 640px);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .course-list {
      display: grid;
      gap: 10px;
      margin-top: 20px;
    }

    .course {
      display: block;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      background: #fff;
    }

    .course:hover {
      border-color: var(--accent);
      background: var(--soft);
    }

    .course strong {
      display: block;
      margin-bottom: 3px;
      color: var(--accent-dark);
      font-size: 17px;
    }

    .course span {
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>科大课程复习</h1>
    <p>课程复习资料与交互式练习页。</p>
    <div class="course-list">
      <a class="course" href="./数理逻辑基础/真题向练习.html">
        <strong>数理逻辑基础</strong>
        <span>命题演算、谓词演算真题向练习</span>
      </a>
    </div>
  </main>
</body>
</html>
